<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a7fcc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%222%22 width=%2220%22 height=%2228%22 rx=%224%22 fill=%22%231a7fcc%22/%3E%3Cpath d=%22M10 16a6 6 0 0 1 12 0z%22 fill=%22%23e2601a%22/%3E%3Cpath d=%22M10 16a6 6 0 0 0 12 0z%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222%22 fill=%22%23fff%22 stroke=%22%2310233a%22/%3E%3C/svg%3E">
<title>Poké Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef6fd; --panel:#ffffff; --panel2:#e8f2fb; --ink:#10233a; --ink2:#3d5570; --muted:#6c839d; --line:#d3e3f2;
  --accent:#1a7fcc; --accent-soft:#dcedfb; --accent-ink:#ffffff;
  --orange:#e2601a; --orange-soft:#fff0e4; --orange-ink:#ffffff;
  --good:#12805c; --good-soft:#dff3ea; --bad:#c43d3d; --bad-soft:#fbe6e6; --hot:#e2601a; --hot-soft:#fff0e4; --gold:#a8750b; --gold-soft:#fbf1d9;
  --shadow:0 1px 2px rgba(16,35,58,.06),0 8px 24px rgba(26,127,204,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1624; --panel:#12223a; --panel2:#182c47; --ink:#e9f2fb; --ink2:#b3c6db; --muted:#7f98b3; --line:#243a57;
  --accent:#62b8ff; --accent-soft:#16304f; --accent-ink:#0b1624;
  --orange:#ff8a3d; --orange-soft:#3a2413; --orange-ink:#1a0f06;
  --good:#43c690; --good-soft:#14322a; --bad:#f07474; --bad-soft:#3a1c22; --hot:#ff8a3d; --hot-soft:#3a2413; --gold:#e3b64a; --gold-soft:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1624; --panel:#12223a; --panel2:#182c47; --ink:#e9f2fb; --ink2:#b3c6db; --muted:#7f98b3; --line:#243a57;
  --accent:#62b8ff; --accent-soft:#16304f; --accent-ink:#0b1624;
  --orange:#ff8a3d; --orange-soft:#3a2413; --orange-ink:#1a0f06;
  --good:#43c690; --good-soft:#14322a; --bad:#f07474; --bad-soft:#3a1c22; --hot:#ff8a3d; --hot-soft:#3a2413; --gold:#e3b64a; --gold-soft:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 420px at 0% -8%,var(--accent-soft),transparent 62%),radial-gradient(900px 380px at 100% -6%,var(--orange-soft),transparent 58%),var(--bg);background-repeat:no-repeat;min-height:100vh;color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;overflow-x:clip}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.mark{width:30px;height:30px;flex:none}
.stamp{font-size:12.5px;color:var(--muted)}
.stamp b{color:var(--ink2);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.primary:hover{filter:brightness(1.06)}

/* hot strip */
.hot{background:var(--hot-soft);border:1px solid color-mix(in srgb,var(--hot) 35%,transparent);border-radius:16px;padding:14px 16px 16px;margin-bottom:16px}
.hot .tag{white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--hot);font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:10px}
.hot .tag small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--ink2)}
.hotlist{display:flex;gap:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.hotcard{flex:none;width:250px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border:1px solid color-mix(in srgb,var(--hot) 25%,var(--line));border-radius:14px;padding:10px;color:var(--ink);text-decoration:none}
.hotcard:hover{border-color:var(--hot)}
.hotcard .ti{width:64px;height:88px;border-radius:8px;background:var(--panel2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.hotcard .ti img{width:100%;height:100%;object-fit:contain}
.hotcard .nm{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hotcard .sold{font-family:var(--display);font-weight:800;font-size:24px;color:var(--hot);line-height:1.1;margin-top:4px}
.hotcard .vs{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero>*,.insights>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.value{padding:20px}
.value .big{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px;padding-bottom:8px;background:linear-gradient(90deg,var(--accent),var(--orange)) bottom left/64px 4px no-repeat}
.value{border-top:4px solid var(--accent)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;border-radius:999px;padding:2px 9px}
.delta.up{color:var(--good);background:var(--good-soft)} .delta.down{color:var(--bad);background:var(--bad-soft)} .delta.flat{color:var(--muted);background:var(--panel2)}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.split div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.split b{display:block;font-size:14.5px}
.split span{font-size:11.5px;color:var(--muted)}
.pl{margin-top:14px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.pl .row{display:flex;justify-content:space-between;gap:8px}
.chartcard{padding:14px 16px 10px;display:flex;flex-direction:column;min-width:0}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.chart{position:relative;height:230px;margin-top:8px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.chart .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13.5px;text-align:center;padding:20px}

/* shelf */
.shelfhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;margin:22px 0 10px;flex-wrap:wrap}
.shelfhead h2{font-size:20px}
.shelfhead h2::before,.colhead h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--orange);margin-right:9px;vertical-align:middle;transform:translateY(-2px) rotate(45deg)}
.shelf{overflow-x:auto;scrollbar-width:none;border-radius:16px;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.shelf::-webkit-scrollbar{display:none}
.track{display:flex;gap:12px;width:max-content;padding-right:12px}
.deal{width:176px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);display:flex;flex-direction:column;gap:6px;position:relative}
.deal>a{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.heart{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:999px;border:0;background:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:2}
.heart svg{width:17px;height:17px}
.heart[aria-pressed="true"]{color:#e0457b}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.down{background:var(--bad-soft);color:var(--bad)}
.pill.up{background:var(--good-soft);color:var(--good)}
.fc{padding:14px 16px}
.fchead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fcrow{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) minmax(110px,.8fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.fcrow:hover{background:var(--panel2)}
.fcrow .thumb{width:44px;height:44px}
.fcrow .n{font-weight:600;line-height:1.25}
.fcrow .sub{font-size:12px;color:var(--muted)}
.fcrow .proj{font-size:13px;line-height:1.35}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--accent))}
.meterlbl{font-size:12px;color:var(--ink2);margin-top:3px}
.verdict{white-space:nowrap}
.v-strong{background:var(--good-soft);color:var(--good)} .v-hold{background:var(--accent-soft);color:var(--accent)} .v-neutral{background:var(--panel2);color:var(--ink2)} .v-sell{background:var(--orange-soft);color:var(--orange)}
.pm-open{background:var(--good-soft);color:var(--good)} .pm-flip{background:var(--accent-soft);color:var(--accent)} .pm-keep{background:var(--orange-soft);color:var(--orange)}
.pmrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.pmrow:hover{background:var(--panel2)}
.pmrow>.pill{justify-self:start}
.pmrow .n{font-weight:600;line-height:1.25} .pmrow .sub{font-size:12px;color:var(--muted)}
.evbar{position:relative;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.evbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.evlbl{font-size:12px;color:var(--ink2);margin-top:3px}
.loved{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lset{padding:14px}
.lset h3{font-size:17px;margin-bottom:2px}
.lset .opt{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lset .opt:hover{color:var(--accent)}
.hitt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.hitt th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.hitt td{padding:5px 6px;border-bottom:1px solid var(--line)}
.chasegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.chasegrid div{font-size:12px;text-align:center} .chasegrid img{width:100%;aspect-ratio:5/7;object-fit:contain;background:var(--panel2);border-radius:8px}
@media (max-width:700px){.pmrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.pmrow .c2,.pmrow .c3{grid-column:1/3}}
.fcbox{background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:var(--ink2)}
.fcbox .big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 8px}
.fcbox .big3 span{display:block;font-size:11.5px;color:var(--muted)}
.fcbox .big3 b{font-size:15px;color:var(--ink)}
@media (max-width:700px){.fcrow .verdict{grid-column:3;grid-row:1;align-self:start}.hot .tag{flex-wrap:wrap;row-gap:0}.hot .tag small{flex-basis:100%}.fcrow{grid-template-columns:40px minmax(0,1fr) auto;row-gap:6px}.fcrow .proj{grid-column:2/4}.fcrow .mcol{grid-column:2/4}.fcrow .thumb{width:40px;height:40px}}
.riser .s.why{color:var(--good);font-weight:600;white-space:normal}
.rowshelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.simhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 8px;font-size:14px;color:var(--ink2)}
.simhead b{color:var(--ink)}
.favbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:13.5px;margin-bottom:8px}
.deal:hover{border-color:var(--accent)}
.deal .img{aspect-ratio:1;background:var(--panel2);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.deal .img img{width:100%;height:100%;object-fit:contain}
.deal .n{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.deal .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .p{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.deal-p{background:var(--good-soft);color:var(--good)}
.pill.watch{background:var(--panel2);color:var(--ink2)}
.pill.hotp{background:var(--hot-soft);color:var(--hot)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.ins{padding:14px 16px}
.ins h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ins ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ins li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.ins li:first-child{border-top:0}
.ins li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins li span:last-child{white-space:nowrap;flex:none}
.ins .none{color:var(--muted);font-size:13px}

/* collection controls */
.colhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.colhead h2{font-size:24px}
.controls{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-weight:500;opacity:.7;margin-left:3px}
input[type=search],select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px;font-size:14px;min-width:0}
input[type=search]{flex:1 1 220px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}

/* list view */
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--panel2)}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .ph{font-size:10px;color:var(--muted);text-align:center;padding:2px}
.item .n{font-weight:600;line-height:1.3}
.item .m{font-size:12.5px;color:var(--muted);margin-top:1px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.item .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .v b{font-size:14.5px}
.item .v small{font-size:12px;color:var(--muted)}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)}
.grouphead{padding:10px 14px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--panel2);border-top:1px solid var(--line)}
.grouphead:first-child{border-top:0}

/* grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .img{aspect-ratio:5/7;background:var(--panel2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile .img img{width:100%;height:100%;object-fit:contain}
.tile .n{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .s{font-size:12px;color:var(--muted)}
.tile .p{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}

/* binder view */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.page{padding:12px}
.page h3{font-size:14px;font-family:var(--body);font-weight:700;color:var(--ink2);margin:0 2px 10px;display:flex;justify-content:space-between}
.pockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pocket{aspect-ratio:5/7;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;position:relative;cursor:pointer;padding:0}
.pocket img{width:100%;height:100%;object-fit:cover;display:block}
.pocket .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;background:linear-gradient(transparent,rgba(10,12,20,.82));color:#fff;font-size:10.5px;line-height:1.2;text-align:left}
.pocket .cap b{display:block;font-weight:700}
.pocket.empty{border-style:dashed;background:transparent;cursor:default;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.pocket.dim{opacity:.25}
.pocket .flag{position:absolute;top:4px;right:4px}

      <h1>Poké <span style="color:var(--orange)">Vault</span></h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="stamp" id="stamp"></div><button class="btn" id="showbtn" hidden>Show mode</button></div>

</div>

<dialog id="dlg" aria-label="Item details"></dialog>

<script src="local-data.js" onerror="void 0"></script>
<script src="data.enc.js" onerror="void 0"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=2)=>n==null||isNaN(n)?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=n=>fmt(n,n!=null&&Math.abs(n)>=1000?0:2);
const pct=n=>n==null?"—":(n>0?"+":"")+(n*100).toFixed(1)+"%";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const CATS=[["all","All"],["sealed","Sealed"],["graded","Graded"],["binder","Binder"],["later","Later pulls"],["loose","Loose"],["other","Other TCG"]];
const CATNAME=Object.fromEntries(CATS);
let GUEST=false;
let D=null, ui={cat:store.get("pv.cat")||"all",view:store.get("pv.view")||"list",q:"",set:"",sort:store.get("pv.sort")||"value",grade:false,range:store.get("pv.range")||"month"};

/* ---------- data loading ---------- */
async function decrypt(enc,pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(enc.iv)},key,b(enc.ct));
  const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
function lockScreen(msg=""){
  $("#app").innerHTML=`<div class="lock"><form class="card" id="lockf">
    <svg class="lmark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="2" width="20" height="27" rx="3" fill="var(--accent)" opacity=".3"/><rect x="9" y="4" width="20" height="26" rx="3" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><path d="M14 17a5 5 0 0 1 10 0z" fill="var(--orange)"/><circle cx="19" cy="17" r="5" fill="none" stroke="var(--ink)" stroke-width="1.6"/><path d="M14 17h10" stroke="var(--ink)" stroke-width="1.6"/><circle cx="19" cy="17" r="1.6" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.2"/></svg>
    <h2>Steven's Poké Vault</h2>
    <p class="muted" style="margin:0;font-size:14px">Sealed, slabs and binder, priced every 3 hours. Enter the passphrase to open it.</p>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passphrase" aria-label="Passphrase">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label><label class="check"><input type="checkbox" id="showpw"> Show</label></div>
    <div class="err" id="err">${esc(msg)}</div><button class="btn primary" type="submit" style="padding:11px">Unlock</button>
    <button class="btn" type="button" id="guestbtn" style="padding:11px">Look around as a guest</button>
    <p class="muted" style="margin:0;font-size:12.5px;text-align:center">Guests can browse everything but can't change anything.</p></form></div>`;
  $("#guestbtn").onclick=loadGuest;
  $("#showpw").onchange=e=>{$("#pw").type=e.target.checked?"text":"password"};
  $("#lockf").addEventListener("submit",async e=>{e.preventDefault();const pw=$("#pw").value.trim();
    try{D=await decrypt(window.ENC_DATA,pw); if($("#remember").checked) store.set("pv.pw",pw); render();}
    catch(err){$("#err").textContent="That passphrase didn't work. Check it and try again."}});
  $("#pw").focus();
}
function loadGuest(){
  const go=()=>{if(!window.GUEST_DATA){lockScreen("The guest view isn't available yet.");return}GUEST=true;D=window.GUEST_DATA;document.body.classList.add("guest");render()};
  if(window.GUEST_DATA) return go();
  const s=document.createElement("script");s.src="data.guest.js?t="+Date.now();s.onload=go;s.onerror=go;document.head.appendChild(s);
}
function ownerSignIn(){GUEST=false;document.body.classList.remove("showing");document.body.classList.remove("guest");D=null;lockScreen()}
async function boot(){
  if(location.hash==="#guest") return loadGuest();
  if(window.PLAIN_DATA){D=window.PLAIN_DATA;return render()}
  if(!window.ENC_DATA){$("#app").innerHTML=`<p class="muted">No data yet. The first price update hasn't run.</p>`;return}
  const pw=store.get("pv.pw");
  if(pw){try{D=await decrypt(window.ENC_DATA,pw);return render()}catch(e){store.del("pv.pw")}}
  lockScreen();
}
// refresh data every 20 minutes and when the tab comes back
async function refresh(){
  if(window.PLAIN_DATA||!D) return;
  if(GUEST){const s=document.createElement("script");s.src="data.guest.js?t="+Date.now();s.onload=()=>{if(window.GUEST_DATA&&window.GUEST_DATA.updated!==D.updated){D=window.GUEST_DATA;render()}};document.head.appendChild(s);return}
  const s=document.createElement("script");s.src="data.enc.js?t="+Date.now();
  s.onload=async()=>{try{const nd=await decrypt(window.ENC_DATA,store.get("pv.pw")||"");if(nd.updated!==D.updated){D=nd;render()}}catch(e){}};
  document.head.appendChild(s);
}
setInterval(refresh,20*60*1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});

/* ---------- helpers ---------- */
const lineVal=i=>(i.price??0)*(i.qty||1);
const isPoke=i=>(i.game||"Pokemon")==="Pokemon";
const itemsOf=c=>D.items.filter(i=>c==="all"||i.cat===c);
function ago(iso){const m=(Date.now()-new Date(iso))/6e4;if(m<60)return Math.round(m)+" min ago";if(m<1440)return Math.round(m/60)+" hr ago";return Math.round(m/1440)+" days ago"}
function subline(i){
  const parts=[];
  if(i.cat==="sealed") parts.push(esc(i.group||"Sealed"));
  else { if(i.set) parts.push(esc(i.set)); if(i.number) parts.push("#"+esc(i.number)); }
  if(i.cat==="binder"||(i.cat==="other"&&i.page)) parts.push(esc(i.page.replace("IMG_","Page "))+" · "+i.pocket);
  return parts.join(" · ");
}
function badges(i){
  const b=[];
  if(i.pending) b.push(`<span class="pill warn">Pending</span>`);
  if(i.incoming&&!pendingFor(i.id).some(x=>x.change.action==="arrived")) b.push(`<span class="pill acc">${typeof bagIcon!=="undefined"?"":""}On the way</span>`);
  else if(pendingFor(i.id).length) b.push(`<span class="pill warn">Change pending</span>`);
  if(i.grade) b.push(`<span class="pill acc">${esc(i.grade)}</span>`);
  if(i.finish&&!/^regular$/i.test(i.finish)&&i.cat!=="sealed") b.push(`<span class="pill watch">${esc(i.finish)}</span>`);
  if(i.grading?.verdict==="strong") b.push(`<span class="pill gold">▲ Grade it</span>`);
  else if(i.grading?.verdict==="maybe") b.push(`<span class="pill gold">Grade?</span>`);
  if(i.centering==="great") b.push(`<span class="pill deal-p">◎ Great centering</span>`);
  if(i.cost!=null&&i.price!=null&&i.cat==="sealed"&&i.cost>0){const r=lineVal(i)/i.cost-1; if(r>=0.5) b.push(`<span class="pill hotp">↑ ${Math.round(r*100)}% over cost</span>`)}
  if(!isPoke(i)) b.push(`<span class="pill watch">${esc(i.game)}</span>`);
  b.push(outlookPill(i.outlook));
  if(!GUEST&&!i.pending) b.push(bringPill(i));
  if(i.forecast&&(i.forecast.verdict==="Strong hold"||i.forecast.verdict==="Consider selling")) b.push(verdictPill(i.forecast,true));
  return b.join("");
}
function chgHTML(i){if(i.chg7==null||!i.price)return"";const c=i.chg7*(i.qty||1);if(Math.abs(c)<0.01)return`<small>7d flat</small>`;return`<small class="chg ${c>0?"up":"down"}">${c>0?"▲":"▼"} ${fmt(Math.abs(c))} 7d</small>`}
function img(i,cls=""){const src=i.img||i.img_alt;return src?`<img loading="lazy" src="${esc(src)}" alt="${esc(i.name)}" ${i.img_alt&&i.img!==i.img_alt?`onerror="this.onerror=null;this.src='${esc(i.img_alt)}'"`:""}>`:`<span class="ph">${esc(i.name)}</span>`}

/* ---------- render ---------- */
function render(){
  const sb=$("#showbtn"); if(sb){sb.hidden=GUEST;sb.onclick=()=>{store.set("pv.mode","show");renderShow()}}
  if(!GUEST&&store.get("pv.mode")==="show") return renderShow();
  document.body.classList.remove("showing");
  const pk=D.items.filter(isPoke);
  const tot=c=>pk.filter(i=>c.includes(i.cat)).reduce((a,i)=>a+lineVal(i),0);
  const total=tot(["sealed","graded","binder","later","loose"]);
  const H=D.history||[];
  const back=(hours)=>{const t=Date.now()-hours*36e5;let p=null;for(const h of H){if(new Date(h.t)<=t)p=h}return p};
  const d1=back(24), d7=back(24*7);
  const deltaPill=(ref,label)=>{if(!ref)return`<span class="delta flat">${label}: collecting</span>`;const d=total-ref.total;const cls=Math.abs(d)<0.5?"flat":d>0?"up":"down";return`<span class="delta ${cls}">${d>0?"▲":d<0?"▼":""} ${fmt(Math.abs(d))} ${label}</span>`};
  const costItems=pk.filter(i=>i.cost!=null&&i.price!=null);
  const cost=costItems.reduce((a,i)=>a+i.cost,0), costVal=costItems.reduce((a,i)=>a+lineVal(i),0);

function shelfHTML(){
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const dl=shuffle((D.deals||[]).map(d=>({...d,kind:"deal"}))), wl=shuffle((D.watch||[]).slice(0,48).map(d=>({...d,kind:"watch"})));
  const cards=[];while(dl.length||wl.length){if(dl.length)cards.push(dl.shift());if(wl.length)cards.push(wl.shift());if(wl.length)cards.push(wl.shift())}
  if(!cards.length) return `<p class="muted">No listings found yet. The shelf fills in after the next update.</p>`;
  const one=cards.map(dealCard).join("");
  return `<div class="shelf" tabindex="0" aria-label="Deals and wishlist, scrolling"><div class="track">${one}${one.replace(/<a /g,'<a tabindex="-1" ')}</div></div>${similarHTML()}`;
}

  <div class="card ins"><h3><span class="pill gold">▲</span>Worth grading</h3>${g?`<ul>${g}</ul>`:`<p class="none">No raw card clears the grading math yet.</p>`}</div>
  <div class="card ins costcard"><h3><span class="pill hotp">↑</span>Sealed vs what you paid</h3>${s?`<ul>${s}</ul>`:`<p class="none">Waiting on prices.</p>`}</div>

function filtered(){
  const q=ui.q.toLowerCase();
  let L=[...pendingAdds(),...D.items].filter(i=>(ui.cat==="all"||i.cat===ui.cat)&&(!ui.set||i.set===ui.set)&&(!ui.grade||i.grading?.verdict)&&
    (!q||[i.name,i.set,i.number,i.group,i.grade,i.finish,i.page,i.notes].join(" ").toLowerCase().includes(q)));
  const by={outlook:(a,b)=>(b.forecast?.chance??-1)-(a.forecast?.chance??-1),value:(a,b)=>lineVal(b)-lineVal(a),price:(a,b)=>(b.price??-1)-(a.price??-1),chg:(a,b)=>(b.chg7??0)*(b.qty||1)-(a.chg7??0)*(a.qty||1),name:(a,b)=>a.name.localeCompare(b.name),
    binder:(a,b)=>(a.page||"~").localeCompare(b.page||"~")||(a.pocket||0)-(b.pocket||0)};
  return L.sort(by[ui.sort]||by.value);
}

let counted=false;
function countUp(total){
  const el=$("#bigval"); if(!el||counted||matchMedia("(prefers-reduced-motion: reduce)").matches){counted=true;return}
  counted=true; const t0=performance.now(), dur=900;
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt0(total*e); if(k<1) requestAnimationFrame(step); else el.textContent=fmt0(total)};
  requestAnimationFrame(step);
}

/* ---------- chart ---------- */
function series(range){
  const H=(D.history||[]).map(h=>({t:new Date(h.t),v:h.total}));
  const lastPer=(key)=>{const m=new Map();for(const p of H)m.set(key(p.t),p);return[...m.values()]};
  if(range==="3h") return H.filter(p=>Date.now()-p.t<=3*864e5);
  if(range==="day") return lastPer(t=>t.toISOString().slice(0,10)).filter(p=>Date.now()-p.t<=60*864e5);
  if(range==="week"){const wk=t=>{const d=new Date(t);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)};
    const w=lastPer(wk); if(w.length>=4) return w;
    const m=(D.monthly||[]).map(p=>({t:new Date(p.t),v:p.total})); return [...m.filter(p=>Date.now()-p.t<=183*864e5),...w].sort((a,b)=>a.t-b.t);}
  const m=(D.monthly||[]).map(p=>({t:new Date(p.t),v:p.total}));
  const cur=H.length?H[H.length-1]:null; if(cur) m.push(cur); return m;
}
function drawChart(){
  const el=$("#chart"); const S=series(ui.range);
  if(S.length<2){el.innerHTML=`<div class="empty">${S.length?`One point so far: ${fmt0(S[0].v)}.<br>`:""}This view fills in as updates run every 3 hours.</div>`;return}
  const W=el.clientWidth||600, Hh=el.clientHeight||230, pl=56, pr=12, pt=10, pb=24;
  const xs=S.map(p=>+p.t), ys=S.map(p=>p.v);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*0.12||hi*0.05||1; lo=Math.max(0,lo-pad); hi=hi+pad;
  const x=t=>pl+(t-xs[0])/((xs[xs.length-1]-xs[0])||1)*(W-pl-pr), y=v=>pt+(1-(v-lo)/(hi-lo))*(Hh-pt-pb);
  const ticks=4, step=(hi-lo)/ticks;
  const grid=Array.from({length:ticks+1},(_,k)=>{const v=lo+k*step;return`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v>=1000?"$"+(v/1000).toFixed(1)+"k":"$"+Math.round(v)}</text>`}).join("");
  const fmtT=t=>{const d=new Date(t);return ui.range==="3h"?d.toLocaleString("en-US",{weekday:"short",hour:"numeric"}):ui.range==="month"?d.toLocaleDateString("en-US",{month:"short",year:"2-digit"}):d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
  const nx=Math.min(5,S.length), xl=Array.from({length:nx},(_,k)=>{const i=Math.round(k*(S.length-1)/(nx-1||1));return`<text x="${x(xs[i])}" y="${Hh-6}" text-anchor="${k===0?"start":k===nx-1?"end":"middle"}" font-size="11" fill="var(--muted)">${fmtT(xs[i])}</text>`}).join("");
  const path=S.map((p,i)=>`${i?"L":"M"}${x(+p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=`${path}L${x(xs[xs.length-1])},${y(lo)}L${x(xs[0])},${y(lo)}Z`;
  const L=S[S.length-1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Collection value over time">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(+L.t)}" cy="${y(L.v)}" r="5.5" fill="var(--orange)" stroke="var(--panel)" stroke-width="2.5"/>
    <g id="cross" visibility="hidden"><line id="cl" y1="${pt}" y2="${Hh-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><circle id="cc" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/></g>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${Hh}" fill="transparent" id="hit"/></svg><div class="tip" hidden id="tip"></div>`;
  const hit=$("#hit"),tip=$("#tip"),cross=$("#cross");
  const move=e=>{const r=el.getBoundingClientRect();const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const t=xs[0]+(px*W/r.width-pl)/(W-pl-pr)*(xs[xs.length-1]-xs[0]);
    let best=S[0];for(const p of S)if(Math.abs(+p.t-t)<Math.abs(+best.t-t))best=p;
    const cx=x(+best.t),cy=y(best.v);cross.setAttribute("visibility","visible");$("#cl").setAttribute("x1",cx);$("#cl").setAttribute("x2",cx);$("#cc").setAttribute("cx",cx);$("#cc").setAttribute("cy",cy);
    tip.hidden=false;tip.style.left=(cx*r.width/W)+"px";tip.style.top=(cy*r.height/Hh)+"px";
    tip.innerHTML=`<b class="num">${fmt0(best.v)}</b> · ${new Date(best.t).toLocaleString("en-US",ui.range==="month"?{month:"long",year:"numeric"}:{month:"short",day:"numeric",hour:"numeric"})}`};
  hit.addEventListener("mousemove",move);hit.addEventListener("touchmove",move,{passive:true});
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("visibility","hidden");tip.hidden=true});
}

function sparkSVG(c){
  const W=460,H=70,p=4, xs=c.map(a=>a[0]), ys=c.map(a=>a[1]); const lo=Math.min(...ys), hi=Math.max(...ys);

  const d=c.map((a,i)=>`${i?"L":"M"}${x(a[0]).toFixed(1)},${y(a[1]).toFixed(1)}`).join("");

function outlookPill(o){
  if(!o) return "";
  if(o.kind==="caution") return `<span class="pill warn" title="${esc(o.text)}">⚠ ${o.pct!=null?"Likely to drop":"In print"}</span>`;
  if(o.kind==="falling") return `<span class="pill down" title="${esc(o.text)}">↓ Falling</span>`;
  if(o.kind==="rising") return `<span class="pill up" title="${esc(o.text)}">↑ Rising</span>`;

/* ---------- sending changes to the PC (encrypted relay, no email) ---------- */
function getQueue(){try{return JSON.parse(store.get("pv.queue")||"[]")}catch(e){return[]}}
function setQueue(q){store.set("pv.queue",JSON.stringify(q))}
async function relaySend(changes){
  const cfg=D.inbox; if(!cfg) throw new Error("no relay");
  const raw=Uint8Array.from(atob(cfg.key),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify({changes}))));
  const b64=u=>btoa(String.fromCharCode(...u));
  const r=await fetch("https://ntfy.sh/"+cfg.topic,{method:"POST",body:b64(iv)+"."+b64(ct)});
  if(!r.ok) throw new Error("relay "+r.status);
}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function queueChange(change,label){
  change.qid=newId("q");
  const q=getQueue(); q.push({qid:change.qid,change,label,sent:0}); setQueue(q);
  await flushQueue(); updateStamp(); return change.qid;
}
async function flushQueue(){
  if(GUEST) return;
  const q=getQueue(), now=Date.now(), due=q.filter(x=>!x.sent||now-x.sent>6*36e5);   // re-send anything the PC hasn't confirmed in 6 hours
  if(!due.length) return;
  try{await relaySend(due.map(x=>x.change)); due.forEach(x=>x.sent=now); setQueue(q)}
  catch(e){toast("Couldn't reach the relay. I'll retry automatically.")}
}
function reconcileQueue(){
  if(GUEST) return;
  const applied=new Set(D.applied||[]), ids=new Set(D.items.map(i=>i.id));
  setQueue(getQueue().filter(x=>!applied.has(x.qid)&&!(x.change.action==="add"&&ids.has(x.change.cid))));
}
function pendingAdds(){
  if(GUEST) return [];
  return getQueue().filter(x=>x.change.action==="add").map(x=>{const c=x.change;
    return {id:c.cid,cat:c.category,name:c.name,set:c.set,number:c.number,grade:c.grade,qty:+c.qty||1,img:c.img,notes:c.notes,page:c.page,pocket:c.pocket?+c.pocket:null,pending:true,price:null}});
}
function pendingFor(id){return getQueue().filter(x=>x.change.id===id)}
function updateStamp(){
  const n=getQueue().length, el=$("#stamp"); if(!el||!D) return;
  if(GUEST){el.innerHTML=`<span class="guestpill">Guest view · read-only</span> Prices updated <b>${ago(D.updated)}</b> · <button class="linkbtn" id="ownerbtn">Owner sign in</button>`;$("#ownerbtn").onclick=ownerSignIn;return}
  const priced=D.items.filter(i=>i.price!=null).length;
  el.innerHTML=`Prices updated <b>${ago(D.updated)}</b> · ${priced}/${D.items.length} priced${n?` · <span class="pill warn">${n} change${n>1?"s":""} waiting for your PC</span>`:""}`;
}

/* ---------- moving shelf ---------- */
let shelfRAF=0;
function startShelf(){
  const sh=document.querySelector(".shelf"); if(!sh) return; cancelAnimationFrame(shelfRAF);
  let paused=false, acc=sh.scrollLeft, last=performance.now(), resumeT;
  const pause=()=>{paused=true;clearTimeout(resumeT)}, resume=(ms=0)=>{clearTimeout(resumeT);resumeT=setTimeout(()=>{acc=sh.scrollLeft;paused=false},ms)};
  sh.addEventListener("mouseenter",pause); sh.addEventListener("mouseleave",()=>resume(300));
  sh.addEventListener("touchstart",pause,{passive:true}); sh.addEventListener("touchend",()=>resume(3000));
  sh.addEventListener("focusin",pause); sh.addEventListener("focusout",()=>resume(300));
  sh.addEventListener("wheel",()=>{pause();resume(2500)},{passive:true});
  const step=t=>{const d=Math.min(64,t-last);last=t;
    if(!paused&&!document.hidden){const half=sh.scrollWidth/2; acc+=d*0.028; if(acc>=half)acc-=half; sh.scrollLeft=acc;}
    shelfRAF=requestAnimationFrame(step)};
  shelfRAF=requestAnimationFrame(step);
}

function showPicks(text){

const SHOWDEF={markup:1.0,round:"whole",floor:0.85,buyCash:0.65,buyTrade:0.8};
// sealed he's holding long-term: still being reprinted (let supply dry up) or sleeper sets
const HOLD_REPRINT=/prismatic|\b151\b/i, HOLD_SLEEPER=/stellar crown|twilight masquerade|paldea evolved/i;
function showCfg(){try{return {...SHOWDEF,...JSON.parse(store.get("pv.showcfg")||"{}")}}catch(e){return {...SHOWDEF}}}

let showTab="table", showQ="", showCat="all", showTier="all";
const TIERS={sell:{label:"Sell now",cls:"t-sell"},bring:{label:"Bring",cls:"t-bring"},bulk:{label:"Bulk bin",cls:"t-bulk"},home:{label:"Keep home",cls:"t-home"}};
const bagIcon=`<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M9 3h6a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2V5a2 2 0 0 1 2-2zm0 4h6V5H9v2z"/></svg>`;
let dupCache=null;
function dupInfo(){
  if(dupCache&&dupCache.d===D) return dupCache.m;
  const g={}; D.items.filter(i=>["binder","later","loose"].includes(i.cat)).forEach(i=>{const k=(i.name+"|"+(i.number||"")+"|"+(i.set||"")).toLowerCase();(g[k]=g[k]||[]).push(i)});
  const m={}; Object.values(g).forEach(L=>{if(L.length>1) L.slice(1).forEach(i=>m[i.id]=L.length)});   // keep the first copy, the rest are trade bait
  dupCache={d:D,m}; return m;
}
function bringInfo(i){
  const f=i.forecast, o=i.outlook, full=(i.name+" "+(i.set||""));
  if(i.incoming&&!pendingFor(i.id).some(x=>x.change.action==="arrived")) return {tier:"home",why:"Not here yet: on the way."};
  if(i.cat==="sealed"){
    if(HOLD_REPRINT.test(full)) return {tier:"home",why:"Long-term hold: still being reprinted. Let supply dry up."};
    if(HOLD_SLEEPER.test(full)) return {tier:"home",why:"Sleeper set: hold."};
    if(/30th celebration/i.test(full)) return {tier:"home",why:"Your 30th Celebration set: hold."};
  }
  if(i.grading?.verdict==="strong"&&i.cat!=="graded") return {tier:"home",why:"Grade it first. Worth a lot more slabbed."};
  const dup=dupInfo()[i.id]; if(dup) return {tier:"sell",why:`Duplicate: you have ${dup}. Great trade bait.`};
  if(o?.kind==="caution"&&o.pct!=null) return {tier:"sell",why:"New-set price likely to drop. Sell while it's high."};
  if(o?.kind==="falling") return {tier:"sell",why:o.text||"Falling. Sell now."};
  if(f?.verdict==="Consider selling") return {tier:"sell",why:"Outlook says sell."};
  if(f?.verdict==="Strong hold") return {tier:"home",why:`Strong hold: projected ${pct(f.pct12)} in a year.`};
  if(i.cat!=="sealed"&&i.cat!=="graded"&&(i.price||0)<3) return {tier:"bulk",why:"Under $3: bulk bin or bundle filler."};
  if(i.cat==="sealed"&&o?.kind==="caution") return {tier:"bring",why:"In print: sells easily and you can restock."};
  return {tier:"bring",why:f?`${f.verdict} outlook.`:"Fair to sell at market."};
}
function pendShow(i){return getQueue().filter(x=>x.change.action==="show"&&x.change.id===i.id).pop()}
function forSale(i){const p=pendShow(i); if(p&&p.change.show!=null) return p.change.show; if(i.show===true||i.show===false) return i.show; return bringInfo(i).tier!=="home"}
function askOf(i){
  const p=getQueue().filter(x=>x.change.action==="show"&&x.change.id===i.id&&x.change.ask!=null).pop();
  if(p) return +p.change.ask; if(i.ask!=null) return i.ask;
  if(i.price==null) return null; const c=showCfg(); let v=i.price*c.markup;
  if(c.round==="whole") v=v<5?Math.max(0.5,Math.round(v*2)/2):Math.round(v); else if(c.round==="99") v=Math.max(0.99,Math.floor(v)+0.99); else if(c.round==="5") v=v>=50?Math.round(v/5)*5:Math.round(v);
  return v;
}

function wireSourcing(){

  $("#ladd").onclick=add; $("#lmkt").onkeydown=e=>{if(e.key==="Enter")add()};
  $("#lask").onchange=e=>{store.set("pv.lotask",e.target.value);renderShow()};

    ${!bundle&&items[0].qty>1?`<label>How many<input id="sn" type="number" min="1" max="${items[0].qty}" value="1" style="font-size:22px"></label>`:"<span></span>"}
    <label>Paid with<select id="spay"><option value="cash">Cash</option><option value="card">Card / app</option></select></label><span></span>
    <p class="full" style="margin:0;font-size:13px" id="offnote">${offerNote(sug,ask,floor,mkt)}</p>
    <p class="full muted" style="margin:0;font-size:12.5px">Sticker ${fmt(ask)}${bundle&&items.length>=3?" (bundle price is 10% off)":""} · your lowest ${fmt(floor,0)} · market ${fmt(mkt)}</p>
    <div class="actions"><button class="btn" type="button" id="scancel">Cancel</button><button class="btn primary" type="submit">Record sale</button></div></form>`;
  $("#dlg").showModal(); $("#xbtn").onclick=$("#scancel").onclick=()=>$("#dlg").close();
  $("#sp").oninput=e=>{$("#offnote").innerHTML=offerNote(+e.target.value,ask,floor,mkt)};
  $("#soldf").onsubmit=async e=>{e.preventDefault(); const total=+$("#sp").value||0, pay=$("#spay").value;
    if(bundle){addLedger("sale",`Bundle: ${items.map(i=>i.name).join(", ")}`,total,pay);
      for(const i of items){const share=ask?total*askOf(i)/ask:0; await queueChange({action:"remove",id:i.id,name:i.name,reason:"sold",price:share.toFixed(2),value:i.price!=null?(i.price*(i.qty||1)).toFixed(2):""},`sold in bundle`)}}
    else{const i=items[0], n=i.qty>1?Math.max(1,Math.min(i.qty,+$("#sn").value||1)):1;
      addLedger("sale",`${i.name}${n>1?" ×"+n:""}`,total*n,pay);
      if(n>=(i.qty||1)) await queueChange({action:"remove",id:i.id,name:i.name,reason:"sold",price:total,value:i.price!=null?(i.price*(i.qty||1)).toFixed(2):""},`sold (${fmt(total)})`);
      else await queueChange({action:"qty",id:i.id,qty:(i.qty||1)-n},`sold ${n}, quantity → ${(i.qty||1)-n}`)}
    bundleSel.clear(); $("#dlg").close(); toast(`Recorded ${fmt(bundle?total:total)}`); renderShow()};
}
const bundleSel=new Set();
function askDialog(i){
  $("#dlg").innerHTML=`<button class="x" aria-label="Close" id="xbtn">×</button><form class="form" id="askf"><h3>Your price: ${esc(i.name)}</h3>
    <label>Sticker price ($)<input id="ap" type="number" inputmode="decimal" step="0.01" min="0" value="${(askOf(i)||0).toFixed(2)}" style="font-size:22px"></label><span></span>
    <p class="full muted" style="margin:0;font-size:12.5px">Market ${fmt(i.price)}. Leave blank to go back to the automatic price.</p>
    <div class="actions"><button class="btn" type="button" id="acancel">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`;
  $("#dlg").showModal(); $("#xbtn").onclick=$("#acancel").onclick=()=>$("#dlg").close();
  $("#askf").onsubmit=async e=>{e.preventDefault();const v=$("#ap").value;await queueChange({action:"show",id:i.id,show:true,ask:v===""?null:+v},"price");$("#dlg").close();renderShow()};
}
function wireShow(){
  const b=$("#showbody"); if(!b) return;
  const keep=(id,fn)=>{const el=$("#"+id); if(el) el.oninput=e=>{fn(e.target.value);const pos=e.target.selectionStart;renderShow();const n=$("#"+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}};
  keep("sq",v=>showQ=v);
  const sc=$("#scat"); if(sc) sc.onchange=e=>{showCat=e.target.value;renderShow()};
  const stt=$("#stier"); if(stt) stt.onchange=e=>{showTier=e.target.value;renderShow()};
  const bb2=$("#bundlebtn"); const upd=()=>{if(bb2) bb2.textContent=bundleSel.size?`Sell bundle of ${bundleSel.size}`:"Bundle: tick items below"};
  if(bb2){document.querySelectorAll("[data-bun]").forEach(x=>x.checked=bundleSel.has(x.dataset.bun));upd();bb2.onclick=()=>{if(bundleSel.size>1) soldDialog([...bundleSel].map(id=>D.items.find(i=>i.id===id)).filter(Boolean)); else toast("Tick 2 or more items to bundle them.")}}
  b.onchange=e=>{const x=e.target; if(x.dataset.bun){x.checked?bundleSel.add(x.dataset.bun):bundleSel.delete(x.dataset.bun);upd()}
    if(x.dataset.pk){const P=packed();P[x.dataset.pk]=x.checked;store.set("pv.packed",JSON.stringify(P))}};
  b.onclick=async e=>{
    const s=e.target.closest("[data-sold]"); if(s){soldDialog(D.items.find(x=>x.id===s.dataset.sold));return}
    const a=e.target.closest("[data-ask]"); if(a){askDialog(D.items.find(x=>x.id===a.dataset.ask));return}
    const t=e.target.closest("[data-tog]"); if(t){const i=D.items.find(x=>x.id===t.dataset.tog);await queueChange({action:"show",id:i.id,show:!forSale(i)},forSale(i)?"leave home":"bring");renderShow();return}
    const d=e.target.closest("[data-bdel]"); if(d){let r=JSON.parse(store.get("pv.buyrows")||"[]");r.splice(+d.dataset.bdel,1);store.set("pv.buyrows",JSON.stringify(r));renderShow();return}
    const td=e.target.closest("[data-tdel],[data-mdel],[data-madd]"); if(td){let T=JSON.parse(store.get("pv.trade")||'{"theirs":[],"mine":[]}');
      if(td.dataset.tdel!=null) T.theirs.splice(+td.dataset.tdel,1); if(td.dataset.mdel) T.mine=T.mine.filter(x=>x!==td.dataset.mdel); if(td.dataset.madd&&!T.mine.includes(td.dataset.madd)) T.mine.push(td.dataset.madd);
      store.set("pv.trade",JSON.stringify(T));renderShow()}
  };
  const pr=$("#pkreset"); if(pr) pr.onclick=()=>{if(pr.dataset.sure){store.set("pv.packed","{}");renderShow()}else{pr.dataset.sure=1;pr.textContent="Tap again to unpack all"}};
  const badd=$("#badd"); if(badd){const add=()=>{const m=+$("#bmkt").value;if(!m){$("#bmkt").focus();return}let r=JSON.parse(store.get("pv.buyrows")||"[]");r.push({name:$("#bname").value.trim(),mkt:m});store.set("pv.buyrows",JSON.stringify(r));renderShow();$("#bmkt").focus()};
    badd.onclick=add; $("#bmkt").onkeydown=e=>{if(e.key==="Enter")add()}}
  const tadd=$("#tadd"); if(tadd){const add=()=>{const m=+$("#tmkt").value;if(!m){$("#tmkt").focus();return}let T=JSON.parse(store.get("pv.trade")||'{"theirs":[],"mine":[]}');T.theirs.push({name:$("#tname").value.trim(),mkt:m});store.set("pv.trade",JSON.stringify(T));renderShow();$("#tmkt").focus()};
    tadd.onclick=add; $("#tmkt").onkeydown=e=>{if(e.key==="Enter")add()}}
  const tq=$("#tq"); if(tq) tq.oninput=e=>{const q=e.target.value.toLowerCase(); $("#tres").innerHTML=q.length<2?"":D.items.filter(i=>forSale(i)&&(i.name+" "+(i.set||"")).toLowerCase().includes(q)).slice(0,8).map(i=>`<div class="srow" style="grid-template-columns:minmax(0,1fr) auto auto"><span>${esc(i.name)} <span class="muted">${esc(i.set||"")}</span></span><span class="num">${fmt(askOf(i))}</span><button class="btn" data-madd="${esc(i.id)}">Add</button></div>`).join("")};
  const tc=$("#tclear"); if(tc) tc.onclick=()=>{store.set("pv.trade",'{"theirs":[],"mine":[]}');renderShow()};
  const bc=$("#bclear"); if(bc) bc.onclick=()=>{store.set("pv.buyrows","[]");renderShow()};
  const bb=$("#bbuy"); if(bb) bb.onclick=()=>{const c=showCfg();const r=JSON.parse(store.get("pv.buyrows")||"[]");const tot=r.reduce((a,x)=>a+(+x.mkt||0),0);
    addLedger("buy",r.map(x=>x.name).filter(Boolean).join(", ")||`${r.length} card${r.length>1?"s":""}`,Math.round(tot*c.buyCash),"cash");store.set("pv.buyrows","[]");toast("Buy recorded. Add the cards to your collection with + Add item.");renderShow()};
  const ls=$("#lstart"); if(ls) ls.onchange=e=>{const L=ledger();L.start=+e.target.value||0;saveLedger(L);renderShow()};
  const lr=$("#lreset"); if(lr) lr.onclick=()=>{if(lr.dataset.sure){saveLedger({start:0,entries:[]});renderShow()}else{lr.dataset.sure=1;lr.textContent="Tap again to clear today"}};
  const lc=$("#lcsv"); if(lc) lc.onclick=()=>{const L=ledger();const csv=[["Time","Type","Item","Amount","Paid with"],...L.entries.map(e=>[e.time,e.type,e.name,e.amount,e.pay])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`show-ledger-${new Date().toISOString().slice(0,10)}.csv`;a.click()};
  const sv=(id,k)=>{const el=$("#"+id);if(el) el.onchange=e=>{const c=showCfg();c[k]=isNaN(+e.target.value)?e.target.value:+e.target.value;saveCfg(c);toast("Saved")}};
  sv("cmark","markup");sv("cround","round");sv("cfloor","floor");sv("cbuy","buyCash");sv("ctrade","buyTrade");
}

/* ---------- export ---------- */
function exportCSV(){
  const cols=["Category","Name","Set","Number","Grade","Finish","Qty","Unit price","Line value","Cost basis","Binder page","Pocket","PriceCharting","TCGplayer ID"];
  const rows=D.items.map(i=>[CATNAME[i.cat]||i.cat,i.name,i.set||"",i.number||"",i.grade||"",i.finish||"",i.qty||1,i.price??"",i.price==null?"":lineVal(i).toFixed(2),i.cost??"",i.page||"",i.pocket||"",i.pc_url||"",i.tcg_id||""]);
  const csv=[cols,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`pokemon-collection-${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{ui.range=b.dataset.range;store.set("pv.range",ui.range);document.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",x===b));drawChart()});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ui.cat=b.dataset.cat;store.set("pv.cat",ui.cat);document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderCol()});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ui.view=b.dataset.view;store.set("pv.view",ui.view);document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderCol()});
  $("#q").oninput=e=>{ui.q=e.target.value.trim();renderCol()};
  $("#set").onchange=e=>{ui.set=e.target.value;renderCol()};
  $("#sort").onchange=e=>{ui.sort=e.target.value;store.set("pv.sort",ui.sort);renderCol()};
  $("#gradeonly").onchange=e=>{ui.grade=e.target.checked;renderCol()};
  $("#csv").onclick=exportCSV;
  $("#addbtn").onclick=openAdd;
  $("#app").onclick=e=>{
    const ps=e.target.closest("[data-set]"); if(ps){openSet(ps.dataset.set);return}
    if(e.target.id==="pmmore"){pmAll=!pmAll;$("#pm").outerHTML=packHTML().replace(/^[\s\S]*?(<div class="card fc" id="pm")/,"$1");return}
    const h=e.target.closest(".heart"); if(h){e.preventDefault();const pid=h.dataset.pid;
      const all=[...(D.deals||[]),...(D.watch||[]),...(D.similar||[]).flatMap(g=>g.cards),...(D.risers||[]),...Object.values(localFavs())];
      const d=all.find(x=>String(x.pid)===pid); if(d) toggleFav(d); return}
    const t=e.target.closest("[data-id]");if(t)openItem(t.dataset.id)};
  renderFavBar();
}
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>D&&drawChart(),150)});
boot();
</script>
